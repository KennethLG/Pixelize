<div class="anim" data-show="frames">
  <div class="panel anim-off" id="animOff">
    <p>Animation is off. Turn on <b>This image has several frames</b> on the left if this is a spritesheet, or go on to export.</p>
  </div>
  <div class="anim-body" id="animBody">
    <figure class="panel">
      <figcaption><span class="label">Preview</span><span class="tag" id="animInfo"></span></figcaption>
      <div class="stage anim-stage"><canvas id="animCanvas"></canvas></div>
      <div class="toolbar">
        <button type="button" class="ghost small" id="playBtn">Pause</button>
        <span class="frame-info" id="frameInfo"></span>
      </div>
    </figure>
    <figure class="panel">
      <figcaption><span class="label">Align frame</span><span class="tag" id="alignTag"></span></figcaption>
      <div class="stage align-stage" id="alignStage"><canvas id="alignCanvas" tabindex="0" aria-label="Selected frame. Drag it or use the arrow keys to move it."></canvas></div>
      <div class="toolbar">
        <div class="group">
          <button type="button" class="ghost small" id="nudgeL" aria-label="Move left">←</button>
          <button type="button" class="ghost small" id="nudgeU" aria-label="Move up">↑</button>
          <button type="button" class="ghost small" id="nudgeD" aria-label="Move down">↓</button>
          <button type="button" class="ghost small" id="nudgeR" aria-label="Move right">→</button>
          <output id="nudgeVal">0, 0</output>
          <button type="button" class="ghost small" id="nudgeReset">Reset</button>
        </div>
        <div class="group">
          <span class="muted">Ghost</span>
          <div class="seg small" role="radiogroup" aria-label="Ghost frame">
            <label><input type="radio" name="ghost" value="prev" checked>Previous</label>
            <label><input type="radio" name="ghost" value="first">First</label>
            <label><input type="radio" name="ghost" value="none">None</label>
          </div>
        </div>
      </div>
      <p class="hint">Drag the frame or use the arrow keys to move it 1 px. The faint frame behind it and the center lines help you line it up.</p>
    </figure>
    <div class="panel frames-panel">
      <div class="frames" id="frames"></div>
      <div class="row sel-row">
        <button type="button" class="ghost small" id="moveL" aria-label="Move frame earlier">◀ Earlier</button>
        <button type="button" class="ghost small" id="moveR" aria-label="Move frame later">Later ▶</button>
        <button type="button" class="ghost small" id="selToggle">Exclude</button>
        <span class="muted">Duration</span>
        <button type="button" class="ghost small" id="holdMinus" aria-label="Shorter">−</button>
        <output id="holdVal">1×</output>
        <button type="button" class="ghost small" id="holdPlus" aria-label="Longer">+</button>
        <button type="button" class="ghost small" id="resetAllOffsets">Reset all positions</button>
      </div>
      <p class="hint">Click a frame to align it. Drag frames to reorder them. × takes a frame out of the animation.</p>
    </div>
  </div>
</div>

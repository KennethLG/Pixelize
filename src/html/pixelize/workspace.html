<section class="work">
  <div class="welcome" data-show="image">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose an image">
      <strong>Drop an image here</strong>
      <small>or click to choose one</small>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <div class="stats" data-show="grid colors clean edit frames export">
    <div class="stat"><span>Original</span><b id="stIn">–</b></div>
    <div class="stat"><span>Fake pixel<span id="stConf"></span></span><b id="stCell">–</b></div>
    <div class="stat"><span>Real size</span><b id="stOut">–</b></div>
    <div class="stat"><span>Colors</span><b id="stPal">–</b></div>
  </div>
  <div class="warnbar" id="confWarn" data-show="grid" hidden>
    <p>The grid detection is unsure about this image. Check the lines on the original, or set the pixel size yourself.</p>
    <button type="button" class="ghost small" id="warnManual">Adjust manually</button>
  </div>

  <!-- @include pixelize/views.html -->

  <!-- @include pixelize/palette.html -->

  <!-- @include pixelize/animation.html -->
</section>

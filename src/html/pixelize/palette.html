<div class="panel" data-show="colors edit">
  <div class="pal-head">
    <span class="label">Palette · click a color</span>
    <div class="group">
      <button type="button" class="ghost small" id="copyAllHex">Copy all hex</button>
      <button type="button" class="ghost small" id="palReset" hidden>Undo color changes</button>
    </div>
  </div>
  <div class="swatches" id="swatches"></div>
  <div class="sw-editor" id="swEditor" hidden>
    <span class="sw-info" id="swInfo"></span>
    <button type="button" class="ghost small" id="swCopy">Copy hex</button>
    <button type="button" class="ghost small" id="swLock" title="Locked colors stay when you change the settings">Lock</button>
    <label class="colorpick">Replace with <input type="color" id="swReplace" aria-label="Replacement color"></label>
    <button type="button" class="ghost small" id="swMerge">Merge into…</button>
  </div>
</div>

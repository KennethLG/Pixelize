<div class="views" data-show="grid colors clean edit export">
  <figure class="panel" data-show="grid">
    <figcaption><span class="label">Original</span><span class="tag" id="srcTag"></span></figcaption>
    <div class="stage"><canvas id="srcCanvas"></canvas></div>
  </figure>
  <figure class="panel">
    <figcaption><span class="label">Result</span><span class="tag" id="resTag"></span></figcaption>
    <div class="stage edit-stage pan" id="editStage"><canvas id="editCanvas" aria-label="Result"></canvas></div>
    <div class="toolbar">
      <div class="group">
        <button type="button" class="ghost small" id="zoomOutBtn" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <output id="zoomLabel">100%</output>
        <button type="button" class="ghost small" id="zoomInBtn" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button type="button" class="ghost small" id="fitBtn" title="Fit (0)">Fit</button>
        <label class="check"><input type="checkbox" id="pixGrid" checked>Grid</label>
      </div>
      <div class="group compare" data-show="colors clean edit">
        <label class="check"><input type="checkbox" id="compare">Compare</label>
        <input type="range" id="split" min="0" max="100" value="50" aria-label="Before and after split" disabled>
      </div>
    </div>
  </figure>
</div>

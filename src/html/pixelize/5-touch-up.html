<!-- 5 · Touch up -->
<section class="step-panel" data-panel="edit" hidden>
  <h2>Touch up pixels</h2>
  <p>Fix single pixels by hand. You can skip this.</p>
  <div class="toolgrid" role="toolbar" aria-label="Editing tools">
    <button type="button" class="tool" data-tool="pan" title="Move the view (H, or hold Space)">Move <kbd>H</kbd></button>
    <button type="button" class="tool" data-tool="pencil" title="Pencil (B)">Pencil <kbd>B</kbd></button>
    <button type="button" class="tool" data-tool="eraser" title="Eraser (E)">Eraser <kbd>E</kbd></button>
    <button type="button" class="tool" data-tool="fill" title="Fill an area of one color (G)">Fill <kbd>G</kbd></button>
    <button type="button" class="tool" data-tool="picker" title="Take a color from the image (I)">Eyedropper <kbd>I</kbd></button>
  </div>
  <label class="colorpick">Color <input type="color" id="drawColor" value="#1b1530" aria-label="Drawing color"><code id="drawHex">#1b1530</code></label>
  <div class="btns">
    <button type="button" class="ghost small" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
    <button type="button" class="ghost small" id="redoBtn" title="Redo (Ctrl+Y)">Redo</button>
    <button type="button" class="ghost small" id="clearEdits">Clear edits</button>
  </div>
  <p class="hint" id="editInfo">No pixel edits</p>
  <p class="hint">Click a color in the palette below the image to draw with it. Edits are lost if the size of the result changes, so finish the earlier steps first.</p>
</section>

<!-- 6 · Animation -->
<section class="step-panel" data-panel="frames" hidden>
  <h2>Animation</h2>
  <label class="check strong"><input type="checkbox" id="animOn" checked>This image has several frames</label>
  <p class="hint" id="animOffHint">Turn it on for spritesheets to split, align and play the frames. Single images can skip this step.</p>
  <div class="box" id="animOpts">
    <span class="label">Split into frames</span>
    <div class="seg" role="radiogroup" aria-label="Split mode">
      <label><input type="radio" name="splitMode" id="splitAuto" value="auto" checked>Auto</label>
      <label><input type="radio" name="splitMode" id="splitGrid" value="grid">Grid</label>
    </div>
    <div class="row" id="gridRow" hidden>
      <span>Columns</span><input type="number" id="cols" min="1" value="4">
      <span>Rows</span><input type="number" id="rows" min="1" value="1">
    </div>
    <div class="box" id="autoRows">
      <div class="row"><span>Min gap</span><input type="number" id="minGap" min="1" value="1"><span>px</span></div>
      <div class="seg" role="radiogroup" aria-label="Frame alignment">
        <label><input type="radio" name="align" id="alignBottom" value="bottom" checked>Align feet</label>
        <label><input type="radio" name="align" id="alignCenter" value="center">Center</label>
      </div>
    </div>
    <p class="hint" id="splitHint">Finds each frame by the empty space around it.</p>

    <span class="label">Playback</span>
    <div class="row"><span>Speed</span><input type="range" id="fps" min="1" max="30" step="1" value="8" aria-label="Frames per second"><output id="fpsOut">8</output><span>fps</span></div>
    <div class="seg" role="radiogroup" aria-label="Direction">
      <label><input type="radio" name="dir" id="dirFwd" value="forward" checked>Forward</label>
      <label><input type="radio" name="dir" id="dirRev" value="reverse">Reverse</label>
      <label><input type="radio" name="dir" id="dirPing" value="pingpong">Ping-pong</label>
    </div>
    <div class="seg" role="radiogroup" aria-label="At the end">
      <label><input type="radio" name="endMode" id="endLoop" value="loop" checked>Loop</label>
      <label><input type="radio" name="endMode" id="endOnce" value="once">Play once</label>
    </div>
    <label class="check"><input type="checkbox" id="onion">Onion skin on the preview</label>
  </div>
</section>

<div class="sp-bar panel">
  <div class="group">
    <button type="button" class="ghost small" id="spOpen" title="Open a PNG, a _stripN.png strip or a .pixelize file">Open…</button>
    <input type="file" id="spFile" accept="image/*,.pixelize,.json" hidden>
    <button type="button" class="ghost small" id="spSave" title="Save layers and frames as a .pixelize file">Save project</button>
  </div>
  <div class="group">
    <input type="number" id="spW" min="1" max="2048" value="32" aria-label="Width"><span class="muted">×</span><input type="number" id="spH" min="1" max="2048" value="32" aria-label="Height">
    <button type="button" class="ghost small" id="spNew" title="Start a blank sprite of this size">New</button>
    <button type="button" class="ghost small" id="spResize" title="Change the canvas size, keeping the art centered">Resize canvas</button>
  </div>
  <div class="group">
    <button type="button" class="ghost small" id="spUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button type="button" class="ghost small" id="spRedo" title="Redo (Ctrl+Y)">Redo</button>
  </div>
  <div class="group sp-export">
    <span class="muted">Export</span>
    <input type="number" id="spScale" min="1" max="64" value="1" aria-label="Export scale" title="Scale"><span class="muted">×</span>
    <button type="button" class="small" id="spExportPng" title="The current frame">PNG</button>
    <button type="button" class="small" id="spExportStrip" title="All frames side by side, named _stripN.png for GameMaker">Strip</button>
    <button type="button" class="small" id="spExportGif">GIF</button>
  </div>
  <p class="status" id="spStatus" role="status"></p>
</div>

<div class="panel sp-palettes">
  <div class="pal-head"><span class="label">In this sprite · <span id="spUsedCount">0</span></span></div>
  <div class="sp-swatches" id="spUsed"></div>
  <p class="hint" id="spUsedEmpty">The colors you draw with show up here.</p>
  <div class="pal-head sp-pal-head">
    <span class="label" title="Click: primary. Right click: secondary. Ctrl+click removes a color.">My palette</span>
    <div class="group">
      <button type="button" class="ghost small" id="spPalAdd" title="Add the primary color">+ Add</button>
      <button type="button" class="ghost small" id="spPalUsed" title="Add every color of the sprite">+ Sprite</button>
      <button type="button" class="ghost small" id="spPalImport" title="Load a .hex, .gpl or PNG palette">Load</button>
      <button type="button" class="ghost small" id="spPalClear" title="Remove every color">Clear</button>
    </div>
  </div>
  <input type="file" id="spPalFile" accept="image/*,.hex,.gpl,.txt,.pal" hidden>
  <div class="sp-swatches" id="spPal"></div>
  <p class="hint" id="spPalEmpty">Empty. Add colors or load a Lospec palette.</p>
</div>

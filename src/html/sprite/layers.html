<div class="panel sp-layers-panel">
  <div class="pal-head">
    <span class="label">Layers</span>
    <div class="group">
      <button type="button" class="ghost small" id="spLayerAdd" title="New layer">+</button>
      <button type="button" class="ghost small" id="spLayerDup" title="Duplicate layer">Dup</button>
      <button type="button" class="ghost small" id="spLayerUp" title="Move up" aria-label="Move layer up">↑</button>
      <button type="button" class="ghost small" id="spLayerDown" title="Move down" aria-label="Move layer down">↓</button>
      <button type="button" class="ghost small" id="spLayerMerge" title="Merge into the layer below">Merge</button>
      <button type="button" class="ghost small" id="spLayerDel" title="Delete layer" aria-label="Delete layer">×</button>
    </div>
  </div>
  <div class="sp-layers" id="spLayers"></div>
  <div class="row"><span>Opacity</span><input type="range" id="spOpacity" min="0" max="100" value="100" aria-label="Layer opacity"><output id="spOpacityOut">100%</output></div>
</div>
